[package]
name = "horizon-design"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"

[dependencies]
accesskit = "0.25.2"
calloop = { version = "0.14.5", features = ["signals"] }
calloop-wayland-source = { version = "0.4.1", features = ["log"] }
horizon-theme = { path = "../horizon-theme" }
log = "0.4.34"
parley = "0.12.0"
pollster = "1.0.1"
raw-window-handle = "0.6.2"
smithay-client-toolkit = { version = "0.21.1", default-features = false, features = ["calloop", "system", "xkbcommon"] }
taffy = "0.15.1"
vello = "0.12.0"
