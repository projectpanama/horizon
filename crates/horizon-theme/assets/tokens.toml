"50"   = "#FAF7F3"
"100"  = "#F4F1EC"
"150"  = "#ECE9E5"
"200"  = "#E2DFDB"
"300"  = "#CBC8C4"
"400"  = "#A8A6A2"
"500"  = "#85837F"
"600"  = "#686662"
"700"  = "#4C4A47"
"800"  = "#34312E"
"850"  = "#282623"
"900"  = "#1F1D1A"
"950"  = "#171512"
"1000" = "#100E0B"

[palette.accent]
"50"  = "#E9F8FD"
"100" = "#D0EEF7"
"200" = "#A8DFEE"
"300" = "#75CCE4"
"400" = "#3EB5D2"
"500" = "#0097B5"
