"200" = "#FFBDB3"
"300" = "#FF978B"
"400" = "#FF7266"
"500" = "#E24942"
"600" = "#C1332E"
"700" = "#9D2622"
"800" = "#771D1A"
"900" = "#541411"

[palette.warning]
"50"  = "#FFF3E5"
"100" = "#FCE3C8"
"200" = "#F7CC9B"
