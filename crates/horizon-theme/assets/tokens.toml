# --- Color roles --------------------------------------------------------------

[color.light]
"surface.topbar"          = "neutral.50"    # the top bar

[color.dark]
"surface.topbar"          = "neutral.950"

# --- Typography ---------------------------------------------------------------
# Sizes and line heights are logical pixels while tracking is in em.

[typography.font.default]
families = ["Inter", "sans-serif"]
features = { cv05 = 1 }

[typography.font.mono]
families = ["JetBrains Mono", "monospace"]
features = {}

[typography.style.display]
font = "default"
size = 72
line-height = 80
weight = 300
slant = "normal"
tracking = -0.03

[typography.style.title-1]
font = "default"
size = 28
line-height = 34
weight = 700
slant = "normal"
tracking = -0.015

[typography.style.title-2]
font = "default"
size = 22
line-height = 28
weight = 650
slant = "normal"
tracking = -0.01

[typography.style.title-3]
font = "default"
size = 17
line-height = 22
weight = 600
slant = "normal"
tracking = -0.005

[typography.style.headline]
font = "default"
size = 14
line-height = 20
weight = 600
slant = "normal"
tracking = 0

[typography.style.body]
font = "default"
size = 14
line-height = 20
weight = 400
slant = "normal"
tracking = 0

[typography.style.callout]
font = "default"
size = 13
line-height = 18
weight = 500
slant = "normal"
tracking = 0

[typography.style.label]
font = "default"
size = 12
line-height = 16
weight = 500
slant = "normal"
tracking = 0.005

[typography.style.caption]
font = "default"
size = 11
line-height = 14
weight = 500
slant = "normal"
tracking = 0.01

[typography.style.mono]
font = "mono"
size = 13
line-height = 20
weight = 400
slant = "normal"
tracking = 0
